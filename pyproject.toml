[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "make-ai-know-her"
version = "0.1.0"
description = "Gender-aware answer layer for sports questions (ICC Global Hackathon 2026)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "requests>=2.31",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gradio[mcp]>=6.29.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["laya>=0.1.6", "transformers>=4.48", "torch", "datasets>=3.0", "safetensors", "huggingface_hub>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mak.compose" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

